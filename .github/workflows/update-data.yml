name: Refresh data

on:
  workflow_dispatch:
    inputs:
      season:
        description: World Cup season to fetch from openfootball, e.g. 2026 or 2022
        required: true
        default: '2026'
      source_url:
        description: Optional override URL for a compatible worldcup.json file
        required: false
        default: ''
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      WORLDCUP_SEASON: ${{ github.event.inputs.season || '2026' }}
      WORLDCUP_SOURCE_URL: ${{ github.event.inputs.source_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh JSON data
        run: node scripts/update-data.mjs

      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh tournament data
          file_pattern: public/data/worldcup.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R public _site/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

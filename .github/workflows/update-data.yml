name: Refresh data

on:
  workflow_dispatch:
    inputs:
      season:
        description: World Cup season to fetch from openfootball, e.g. 2026 or 2022
        required: true
        default: '2026'
      source_url:
        description: Optional override URL for a compatible worldcup.json file
        required: false
        default: ''
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WORLDCUP_SEASON: ${{ github.event.inputs.season || '2026' }}
      WORLDCUP_SOURCE_URL: ${{ github.event.inputs.source_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh JSON data
        run: node scripts/update-data.mjs

      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh tournament data
          file_pattern: public/data/worldcup.json

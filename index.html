<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glorious World Cup Sweepstake</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="hero">
    <div class="hero-copy">
      <h1>Glorious World Cup Sweepstake</h1>
    </div>
    <div class="hero-visual">
      <img src="public/images/trump-infantino-head-kiss.png" alt="Trump and Infantino at a World Cup event" />
      <div class="hero-card">
        <span class="label">Status</span>
        <small id="updatedText"></small>
      </div>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="leaderboards">Team scores</button>
      <button data-tab="fixtures">Fixtures</button>
      <button data-tab="draw">Draw tool</button>
      <button data-tab="rules">Rules</button>
    </nav>

    <section id="overview" class="panel active"></section>
    <section id="leaderboards" class="panel"></section>
    <section id="fixtures" class="panel"></section>
    <section id="draw" class="panel"></section>
    <section id="rules" class="panel"></section>
  </main>

  <footer>
    <p>Data is loaded from JSON files in <code>public/data</code>. Final results can be corrected with
      <code>manual-overrides.json</code>.
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>

</html>
